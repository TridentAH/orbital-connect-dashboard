<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbital">
  <link rel="manifest" href="manifest.json">
  <title>Orbital Connect</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #1a56db;
      --red: #f85149;
      --red-bg: #2d1214;
      --red-border: #6e1a1a;
      --yellow: #e3b341;
      --yellow-bg: #2d2000;
      --yellow-border: #6e5000;
      --green: #3fb950;
      --green-bg: #0d1f0f;
      --green-border: #1a4d1e;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

    header { background: #010409; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .logo-text { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; color: var(--text-primary); }
    .logo-sub { font-size: 11px; color: var(--text-secondary); font-family: 'DM Mono', monospace; letter-spacing: 0.5px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .btn-header { background: var(--surface2); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; }
    .btn-header:hover { background: var(--border); }
    .btn-header.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-header.primary:hover { background: #1648c8; }
    .last-updated { font-size: 11px; color: var(--text-secondary); font-family: 'DM Mono', monospace; }

    main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: center; }
    .stat-number { font-size: 24px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat.red .stat-number { color: var(--red); }
    .stat.yellow .stat-number { color: var(--yellow); }
    .stat.green .stat-number { color: var(--green); }

    .search-bar { margin-bottom: 16px; }
    .search-input { width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 13px; font-family: 'DM Sans', sans-serif; }
    .search-input::placeholder { color: var(--text-secondary); }

    .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 12px; }

    .patient-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; transition: box-shadow 0.2s; }
    .patient-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .patient-card.red { border-left: 4px solid var(--red); }
    .patient-card.yellow { border-left: 4px solid var(--yellow); }
    .patient-card.green { border-left: 4px solid var(--green); }

    .card-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .patient-info { flex: 1; }
    .patient-name { font-size: 16px; font-weight: 600; margin-bottom: 3px; color: var(--text-primary); }
    .patient-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; flex-wrap: wrap; }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .badge.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .badge.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .badge.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .card-body { padding: 0 20px 16px; display: none; }
    .card-body.open { display: block; }
    .divider { height: 1px; background: var(--border); margin-bottom: 16px; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .detail-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .detail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 2px; }
    .detail-value { font-size: 13px; font-weight: 500; color: var(--text-primary); }

    .summary-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 16px; }

    .flags-box { background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--red); margin-bottom: 16px; font-family: 'DM Mono', monospace; }
    .flags-box.yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }

    .no-answer-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }

    .section-divider { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    .clinical-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .clinical-item { background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
    .clinical-key { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 2px; }
    .clinical-value { font-size: 12px; font-weight: 500; color: var(--text-primary); }
    .clinical-value.true { color: var(--yellow); }
    .clinical-value.false { color: var(--green); }
    .clinical-value.urgent { color: var(--red); }
    .clinical-value.monitor { color: var(--yellow); }
    .clinical-value.stable { color: var(--green); }

    .behavioral-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .behavioral-item { background: var(--surface2); border-radius: 6px; padding: 8px 10px; text-align: center; }
    .behavioral-value { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .behavioral-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-top: 2px; }

    .call-history-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .call-history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .call-history-date { font-size: 12px; color: var(--text-secondary); font-family: 'DM Mono', monospace; }
    .call-history-summary { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .outcome-logged { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--green); margin-bottom: 16px; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .btn { padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #1648c8; }
    .btn-outline { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--surface2); }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red-border); }
    .btn-danger:hover { background: var(--red-bg); }

    .outcome-form, .edit-form, .delete-form { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-top: 12px; display: none; }
    .outcome-form.open, .edit-form.open, .delete-form.open { display: block; }
    .outcome-form h4, .edit-form h4, .delete-form h4 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-primary); }
    .delete-form p { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
    .delete-warning { color: var(--red); font-size: 12px; margin-bottom: 8px; }

    select, textarea, input[type="text"], input[type="tel"], input[type="date"] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--surface); margin-bottom: 8px; color: var(--text-primary); }
    .outcome-submit { background: #16a34a; color: white; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-right: 8px; }
    .edit-submit { background: var(--accent); color: white; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-right: 8px; }
    .delete-confirm-btn { background: var(--red); color: white; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }

    .loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 14px; }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 14px; }
    .chevron { font-size: 12px; color: var(--text-secondary); transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 4px; }
    .modal-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .modal-tab { background: none; border: none; color: var(--text-secondary); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; padding: 6px 12px; border-radius: 6px; transition: all 0.15s; }
    .modal-tab.active { background: var(--accent); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 12px; }
    .csv-upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
    .csv-upload-area:hover { border-color: var(--accent); }
    .csv-upload-area p { font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
    .csv-template { font-size: 11px; color: var(--accent); cursor: pointer; text-decoration: underline; margin-bottom: 12px; display: block; }
    .form-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 4px; }
    .form-submit:hover { background: #1648c8; }

    @media (max-width: 600px) {
      .detail-grid, .clinical-grid { grid-template-columns: 1fr; }
      .detail-grid-3, .behavioral-grid { grid-template-columns: 1fr 1fr; }
      .stats-bar { grid-template-columns: repeat(3, 1fr); }
    }

  .collapsible-section {
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  overflow: hidden;
}

.collapsible-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-secondary);
  background: var(--surface2);
  transition: background 0.15s;
}

.collapsible-header:hover { background: var(--border); }

.section-chevron {
  font-size: 10px;
  transition: transform 0.2s;
}

.section-chevron.open { transform: rotate(180deg); }

.collapsible-body {
  display: none;
  padding: 14px;
}

.collapsible-body.open { display: block; }

    .avc-notification {
  background: #1a2a4a;
  border: 1px solid #1a56db;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #6b9fff;
  margin-bottom: 12px;
}

.avc-badge {
  background: var(--accent);
  color: white;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.5px;
}
    
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-text">Orbital Connect</div>
      <div class="logo-sub">BETWEEN VISITS CARE</div>
    </div>
  </div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="btn-header" onclick="loadPatients()">↻ Refresh</button>
    <button class="btn-header primary" onclick="openModal()">+ Add Patient</button>
  </div>
</header>

<main>
  <div class="stats-bar">
    <div class="stat red"><div class="stat-number" id="countRed">—</div><div class="stat-label">Urgent</div></div>
    <div class="stat yellow"><div class="stat-number" id="countYellow">—</div><div class="stat-label">Monitor</div></div>
    <div class="stat green"><div class="stat-number" id="countGreen">—</div><div class="stat-label">Stable</div></div>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search patients by name, condition, or physician..." oninput="filterPatients()">
  </div>

  <div class="section-title">Patient Priority Queue</div>
  <div id="patients"><div class="loading">Loading patients...</div></div>
</main>

<!-- Add Patient Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Add Patient</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchTab('single', this)">Single Patient</button>
      <button class="modal-tab" onclick="switchTab('bulk', this)">Bulk CSV Upload</button>
    </div>
    <div class="tab-content active" id="tab-single">
      <div class="form-group"><label class="form-label">First Name</label><input type="text" id="firstName" placeholder="e.g. Margaret"></div>
      <div class="form-group"><label class="form-label">Last Name</label><input type="text" id="lastName" placeholder="e.g. Johnson"></div>
      <div class="form-group"><label class="form-label">Phone Number</label><input type="tel" id="phoneNumber" placeholder="+14805551234"></div>
      <div class="form-group">
        <label class="form-label">Condition</label>
        <select id="condition">
          <option value="">Select condition...</option>
          <option value="CHF">CHF</option>
          <option value="Diabetes">Diabetes</option>
          <option value="COPD">COPD</option>
          <option value="CKD">CKD</option>
          <option value="Hypertension">Hypertension</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Physician</label><input type="text" id="physicianName" placeholder="e.g. Dr. Abels"></div>
      <div class="form-group"><label class="form-label">First Call Date</label><input type="date" id="firstCallDate"></div>
      <button class="form-submit" onclick="addSinglePatient()">Add Patient</button>
    </div>
    <div class="tab-content" id="tab-bulk">
      <span class="csv-template" onclick="downloadTemplate()">⬇ Download CSV Template</span>
      <div class="csv-upload-area" onclick="document.getElementById('csvFile').click()">
        <div style="font-size: 24px">📄</div>
        <p>Click to upload CSV file</p>
        <p style="font-size: 11px; margin-top: 4px;">or drag and drop</p>
        <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="handleCSVUpload(event)">
      </div>
      <div id="csvPreview" style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;"></div>
      <button class="form-submit" onclick="uploadCSV()" id="csvSubmit" style="display:none">Import Patients</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://oomjzfqecnkshvfgmjqb.supabase.co";
let csvPatients = [];
let allPatients = [];

function formatClinicalValue(key, value) {
  if (value === null || value === undefined) return '<span style="color:var(--text-secondary)">—</span>';
  if (typeof value === 'boolean') return `<span class="clinical-value ${value}">${value ? 'Yes' : 'No'}</span>`;
  if (key === 'overall_clinical_impression') return `<span class="clinical-value ${value}">${value}</span>`;
  return `<span class="clinical-value">${value}</span>`;
}

function renderClinicalData(structured) {
  if (!structured) return '<div class="summary-box" style="color:var(--text-secondary)">No clinical extraction yet</div>';
  const fields = [
    { key: 'chest_pain', label: 'Chest Pain' },
    { key: 'shortness_of_breath', label: 'Shortness of Breath' },
    { key: 'shortness_of_breath_severity', label: 'SOB Severity' },
    { key: 'shortness_of_breath_at_rest', label: 'SOB at Rest' },
    { key: 'swelling', label: 'Swelling' },
    { key: 'swelling_location', label: 'Swelling Location' },
    { key: 'weight_stable', label: 'Weight Stable' },
    { key: 'weight_change_lbs', label: 'Weight Change' },
    { key: 'medication_adherence', label: 'Meds Adherence' },
    { key: 'medication_concerns', label: 'Med Concerns' },
    { key: 'energy_level', label: 'Energy Level' },
    { key: 'dizziness', label: 'Dizziness' },
    { key: 'er_visit_since_last_call', label: 'ER Visit' },
    { key: 'overall_clinical_impression', label: 'Impression' },
  ];
  const html = fields.map(f => `<div class="clinical-item"><div class="clinical-key">${f.label}</div><div>${formatClinicalValue(f.key, structured[f.key])}</div></div>`).join('');
  const concerns = structured.additional_concerns;
  const concernsHtml = concerns ? `<div class="summary-box" style="margin-top:8px"><div class="detail-label" style="margin-bottom:4px">Additional Concerns</div>${concerns}</div>` : '';
  return `<div class="clinical-grid">${html}</div>${concernsHtml}`;
}

function renderBehavioralData(behavioral) {
  if (!behavioral) return '<div class="summary-box" style="color:var(--text-secondary)">No audio analysis yet</div>';
  const sentimentColor = behavioral.overall_sentiment === 'negative' ? 'var(--red)' : behavioral.overall_sentiment === 'positive' ? 'var(--green)' : 'var(--text-secondary)';
  return `
    <div class="behavioral-grid">
      <div class="behavioral-item"><div class="behavioral-value" style="color:${sentimentColor}">${behavioral.overall_sentiment || '—'}</div><div class="behavioral-label">Sentiment</div></div>
      <div class="behavioral-item"><div class="behavioral-value">${behavioral.words_per_minute || '—'}</div><div class="behavioral-label">Words/Min</div></div>
      <div class="behavioral-item"><div class="behavioral-value">${behavioral.hesitation_count ?? '—'}</div><div class="behavioral-label">Hesitations</div></div>
      <div class="behavioral-item"><div class="behavioral-value">${behavioral.positive_sentiment_pct ?? '—'}%</div><div class="behavioral-label">Positive</div></div>
      <div class="behavioral-item"><div class="behavioral-value">${behavioral.negative_sentiment_pct ?? '—'}%</div><div class="behavioral-label">Negative</div></div>
      <div class="behavioral-item"><div class="behavioral-value">${behavioral.audio_duration_seconds ? Math.round(behavioral.audio_duration_seconds / 60) + 'm' : '—'}</div><div class="behavioral-label">Duration</div></div>
    </div>`;
}

function renderCallHistory(history) {
  if (!history || history.length === 0) return '<div class="summary-box" style="color:var(--text-secondary)">No call history yet</div>';
  return history.map(call => {
    const date = new Date(call.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const status = call.overall_status || 'green';
    const statusColor = status === 'red' ? 'var(--red)' : status === 'yellow' ? 'var(--yellow)' : 'var(--green)';
    const duration = call.duration_seconds ? `${Math.round(call.duration_seconds / 60)}m` : '—';
    const outcomeHtml = call.outcome_status ? `<span style="color:var(--green);margin-left:8px">✅ ${call.outcome_status}</span>` : '';
    return `
      <div class="call-history-item">
        <div class="call-history-header">
          <span class="call-history-date">${date}</span>
          <div>
            <span style="color:${statusColor};font-size:11px;font-weight:600;text-transform:uppercase">${status}</span>
            <span style="color:var(--text-secondary);font-size:11px;margin-left:8px">${duration}</span>
            ${outcomeHtml}
          </div>
        </div>
        <div class="call-history-summary">${call.call_summary || 'No summary available'}</div>
        ${call.red_flags_detected ? `<div style="color:var(--red);font-size:11px;margin-top:6px;font-family:monospace"> ${call.red_flags_detected}</div>` : ''}
        ${call.yellow_flags_detected ? `<div style="color:var(--yellow);font-size:11px;margin-top:6px;font-family:monospace">⚠️ ${call.yellow_flags_detected}</div>` : ''}
      </div>`;
  }).join('');
}

function filterPatients() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allPatients.filter(p =>
    `${p.patient_first_name} ${p.patient_last_name}`.toLowerCase().includes(query) ||
    p.condition.toLowerCase().includes(query) ||
    p.physician_name.toLowerCase().includes(query)
  );
  renderPatients(filtered);
}

async function loadPatients() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-dashboard-data`);
    allPatients = await res.json();
    document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString();
    renderPatients(allPatients);
  } catch (err) {
    console.error(err);
    document.getElementById("patients").innerHTML = '<div class="empty">Failed to load patients. Check connection.</div>';
  }
}

function renderPatients(patients) {
  const container = document.getElementById("patients");

  if (!patients || patients.length === 0) {
    container.innerHTML = '<div class="empty">No patients found.</div>';
    document.getElementById("countRed").textContent = 0;
    document.getElementById("countYellow").textContent = 0;
    document.getElementById("countGreen").textContent = 0;
    return;
  }

  patients.sort((a, b) => b.priority_score - a.priority_score);
  document.getElementById("countRed").textContent = patients.filter(p => p.priority_score >= 8).length;
  document.getElementById("countYellow").textContent = patients.filter(p => p.priority_score >= 3 && p.priority_score < 8).length;
  document.getElementById("countGreen").textContent = patients.filter(p => p.priority_score < 3).length;

  container.innerHTML = "";

  patients.forEach(patient => {
    const status = patient.priority_score >= 8 ? "red" : patient.priority_score >= 3 ? "yellow" : "green";
    const statusLabel = status === "red" ? "Urgent" : status === "yellow" ? "Monitor" : "Stable";
    const hasRedFlags = patient.flag_summary && patient.flag_summary !== "No flags" && status === "red";
    const hasYellowFlags = patient.flag_summary && patient.flag_summary !== "No flags" && status === "yellow";

    const structured = patient.structured_data ?
      (typeof patient.structured_data === 'string' ? JSON.parse(patient.structured_data) : patient.structured_data) : null;
    const behavioral = patient.behavioral_data ?
      (typeof patient.behavioral_data === 'string' ? JSON.parse(patient.behavioral_data) : patient.behavioral_data) : null;

    const noCallsLately = patient.call_number === 0 || !patient.last_call_date;
    const noAnswerHtml = noCallsLately ? '' : (() => {
      const lastCall = patient.call_history?.[0];
      if (lastCall && lastCall.duration_seconds < 10) {
        return `<div class="no-answer-box">📵 Last call had no answer or was very short — manual follow up may be needed</div>`;
      }
      return '';
    })();

    const outcomeHtml = patient.outcome_status ? `
      <div class="outcome-logged">
        ✅ Outcome logged: <strong>${patient.outcome_status}</strong>
        ${patient.outcome_notes ? ` — ${patient.outcome_notes}` : ''}
        ${patient.outcome_logged_by ? ` (by ${patient.outcome_logged_by})` : ''}
      </div>` : '';

    const card = document.createElement("div");
    card.className = `patient-card ${status}`;
    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <div class="patient-info">
          <div class="patient-name">${patient.patient_first_name} ${patient.patient_last_name}</div>
          <div class="patient-meta">
            <span>${patient.condition}</span>
            <span>${patient.physician_name}</span>
            ${patient.last_call_date ? `<span>Last call: ${patient.last_call_date}</span>` : "<span>No calls yet</span>"}
            ${patient.next_call_date ? `<span>Next call: ${patient.next_call_date}</span>` : ""}
            ${patient.call_number > 0 ? `<span>${patient.call_number} call${patient.call_number !== 1 ? 's' : ''}</span>` : ""}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="badge ${status}"><span class="badge-dot"></span>${statusLabel}</span>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="card-body">
        <div class="divider"></div>
        ${hasRedFlags ? `<div class="flags-box"> ${patient.flag_summary}</div>` : ""}
        ${hasYellowFlags ? `<div class="flags-box yellow">⚠️ ${patient.flag_summary}</div>` : ""}
        ${noAnswerHtml}
        ${outcomeHtml}

        <div class="detail-grid-3">
          <div><div class="detail-label">Priority Score</div><div class="detail-value">${patient.priority_score}/10</div></div>
          <div><div class="detail-label">Condition</div><div class="detail-value">${patient.condition}</div></div>
          <div><div class="detail-label">Total Calls</div><div class="detail-value">${patient.call_number || 0}</div></div>
        </div>

        <div class="detail-label" style="margin-bottom:6px">Latest Call Summary</div>
        <div class="summary-box">${patient.latest_summary || "No calls yet"}</div>

        <div class="collapsible-section">
  <div class="collapsible-header" onclick="toggleSection(this)">
    <span>Clinical Extraction</span>
    <span class="section-chevron">▼</span>
  </div>
  <div class="collapsible-body">
    ${renderClinicalData(structured)}
  </div>
</div>

<div class="collapsible-section">
  <div class="collapsible-header" onclick="toggleSection(this)">
    <span>Behavioral Analysis</span>
    <span class="section-chevron">▼</span>
  </div>
  <div class="collapsible-body">
    ${renderBehavioralData(behavioral)}
  </div>
</div>

<div class="collapsible-section">
  <div class="collapsible-header" onclick="toggleSection(this)">
    <span>Call History</span>
    <span class="section-chevron">▼</span>
  </div>
  <div class="collapsible-body">
    ${renderCallHistory(patient.call_history)}
  </div>
</div>

        ${patient.avc_unread ? `<div class="avc-notification">📋 After Visit Care summary ready — <strong>${new Date(patient.latest_avc_date).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}</strong></div>` : ""}

<div class="collapsible-section">
  <div class="collapsible-header" onclick="toggleSection(this)">
    <span>After Visit Care ${patient.avc_unread ? '<span class="avc-badge">NEW</span>' : ""}</span>
    <span class="section-chevron">▼</span>
  </div>
  <div class="collapsible-body">
    ${patient.latest_avc_summary ? `
      <div class="summary-box">${patient.latest_avc_summary}</div>
      <div style="font-size:11px;color:var(--text-secondary);margin-bottom:12px">
        ${patient.latest_avc_date ? `Call date: ${new Date(patient.latest_avc_date).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}` : ""}
      </div>
    ` : '<div class="summary-box" style="color:var(--text-secondary)">No After Visit Care calls yet</div>'}
    ${patient.avc_scheduled && patient.next_call_date ? `
  <div style="margin-bottom:8px">
    <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">AVC Scheduled</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
  <input type="date" class="avc-date-picker" value="${patient.next_call_date}" onchange="updateAvcDate(${patient.patient_id}, this.value)" style="margin-bottom:0;flex:1">
  <input type="time" class="avc-time-picker" value="${patient.preferred_call_time || '10:00'}" onchange="updateAvcTime(${patient.patient_id}, this.value)" style="margin-bottom:0;flex:1">
</div>
    <button class="btn btn-danger" onclick="cancelAvc(${patient.patient_id})" style="width:100%">Cancel After Visit Call</button>
  </div>
` : `
  <button class="btn btn-outline" onclick="scheduleAvc(${patient.patient_id}, this)" style="width:100%">Schedule After Visit Call</button>
`}
  </div>
</div>

<div class="section-divider">Actions</div>
<div class="actions">
  <button class="btn btn-primary" onclick="callPatient(${patient.patient_id})">Call Patient Now</button>
  <button class="btn btn-outline" onclick="toggleForm(this, 'outcome-form')">Log Call Outcome</button>
  <button class="btn btn-outline" onclick="toggleForm(this, 'edit-form')">Edit Patient Info</button>
  <button class="btn btn-danger" onclick="toggleForm(this, 'delete-form')">Remove Patient from BVC</button>
</div>

        <div class="outcome-form">
          <h4>Log Outcome</h4>
          <select class="outcome-status-select">
            <option value="">Select outcome...</option>
            <option value="stable">Stable — no action needed</option>
            <option value="physician_notified">Physician notified</option>
            <option value="er_visit">ER visit</option>
            <option value="hospitalized">Hospitalized</option>
            <option value="no_followup">No follow-up needed</option>
          </select>
          <textarea placeholder="Notes (optional)" rows="2" class="outcome-notes"></textarea>
          <input type="text" placeholder="Your name" class="outcome-logged-by">
          <button class="outcome-submit" onclick="logOutcome(this, ${patient.patient_id})">Save Outcome</button>
        </div>

        <div class="edit-form">
          <h4>Edit Patient</h4>
          <input type="text" class="edit-first-name" placeholder="First name" value="${patient.patient_first_name}">
          <input type="text" class="edit-last-name" placeholder="Last name" value="${patient.patient_last_name}">
          <input type="tel" class="edit-phone" placeholder="Phone number" value="${patient.phone_number || ''}">
          <select class="edit-condition">
            <option value="CHF" ${patient.condition === 'CHF' ? 'selected' : ''}>CHF</option>
            <option value="Diabetes" ${patient.condition === 'Diabetes' ? 'selected' : ''}>Diabetes</option>
            <option value="COPD" ${patient.condition === 'COPD' ? 'selected' : ''}>COPD</option>
            <option value="CKD" ${patient.condition === 'CKD' ? 'selected' : ''}>CKD</option>
            <option value="Hypertension" ${patient.condition === 'Hypertension' ? 'selected' : ''}>Hypertension</option>
            <option value="Other" ${patient.condition === 'Other' ? 'selected' : ''}>Other</option>
          </select>
          <input type="text" class="edit-physician" placeholder="Physician" value="${patient.physician_name}">
          <input type="date" class="edit-next-call" value="${patient.next_call_date || ''}">
          <button class="edit-submit" onclick="editPatient(this, ${patient.patient_id})">Save Changes</button>
        </div>

        <div class="delete-form">
          <h4>Remove Patient</h4>
          <p>This will permanently delete <strong>${patient.patient_first_name} ${patient.patient_last_name}</strong> and all their call records. This cannot be undone.</p>
          <p class="delete-warning">Type the patient's full name to confirm:</p>
          <input type="text" class="delete-confirm-input" placeholder="${patient.patient_first_name} ${patient.patient_last_name}">
          <button class="delete-confirm-btn" onclick="deletePatient(this, ${patient.patient_id}, '${patient.patient_first_name} ${patient.patient_last_name}')">Permanently Remove</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector(".chevron");
  body.classList.toggle("open");
  chevron.classList.toggle("open");
}

function toggleForm(btn, formClass) {
  const body = btn.closest(".card-body");
  const form = body.querySelector(`.${formClass}`);
  const allForms = body.querySelectorAll('.outcome-form, .edit-form, .delete-form');
  allForms.forEach(f => { if (f !== form) f.classList.remove('open'); });
  form.classList.toggle("open");
}

async function callPatient(patientId) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/start-batch-call?patient_id=${patientId}`);
  if (res.ok) { alert("✅ Call started successfully"); }
  else { alert("❌ Call failed — check connection"); }
}

async function logOutcome(btn, patientId) {
  const form = btn.closest(".outcome-form");
  const status = form.querySelector(".outcome-status-select").value;
  const notes = form.querySelector(".outcome-notes").value;
  const loggedBy = form.querySelector(".outcome-logged-by").value;
  if (!status) { alert("Please select an outcome"); return; }
  const res = await fetch(`${SUPABASE_URL}/functions/v1/log-outcome`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ call_id: patientId, outcome_status: status, outcome_notes: notes, outcome_logged_by: loggedBy || "staff", followup_required: false })
  });
  if (res.ok) { alert("✅ Outcome logged"); form.classList.remove("open"); loadPatients(); }
  else { alert("❌ Failed to log outcome"); }
}

async function editPatient(btn, patientId) {
  const form = btn.closest(".edit-form");
  const updates = {
    patient_first_name: form.querySelector(".edit-first-name").value.trim(),
    patient_last_name: form.querySelector(".edit-last-name").value.trim(),
    phone_number: form.querySelector(".edit-phone").value.trim(),
    condition: form.querySelector(".edit-condition").value,
    physician_name: form.querySelector(".edit-physician").value.trim(),
    next_call_date: form.querySelector(".edit-next-call").value || null
  };
  if (!updates.patient_first_name || !updates.patient_last_name || !updates.phone_number) {
    alert("Please fill in all required fields");
    return;
  }
  const res = await fetch(`${SUPABASE_URL}/functions/v1/manage-patient`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type: "edit", patient_id: patientId, updates })
  });
  if (res.ok) { alert("✅ Patient updated"); form.classList.remove("open"); loadPatients(); }
  else { alert("❌ Failed to update patient"); }
}

async function deletePatient(btn, patientId, fullName) {
  const form = btn.closest(".delete-form");
  const confirmName = form.querySelector(".delete-confirm-input").value.trim();
  if (!confirmName) { alert("Please type the patient's full name to confirm"); return; }
  const res = await fetch(`${SUPABASE_URL}/functions/v1/manage-patient`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type: "delete", patient_id: patientId, confirm_name: confirmName })
  });
  if (res.ok) { alert("✅ Patient removed"); loadPatients(); }
  else {
    const err = await res.json();
    if (err.error === "Name confirmation does not match") {
      alert("❌ Name doesn't match. Please type the exact full name to confirm deletion.");
    } else {
      alert("❌ Failed to remove patient");
    }
  }
}

function openModal() { document.getElementById("modalOverlay").classList.add("open"); }
function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); clearForm(); }
function handleOverlayClick(e) { if (e.target === document.getElementById("modalOverlay")) closeModal(); }

function clearForm() {
  document.getElementById("firstName").value = "";
  document.getElementById("lastName").value = "";
  document.getElementById("phoneNumber").value = "";
  document.getElementById("condition").value = "";
  document.getElementById("physicianName").value = "";
  document.getElementById("firstCallDate").value = "";
  document.getElementById("csvPreview").textContent = "";
  document.getElementById("csvSubmit").style.display = "none";
  csvPatients = [];
}

function switchTab(tab, btn) {
  document.querySelectorAll(".modal-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(`tab-${tab}`).classList.add("active");
}

async function addSinglePatient() {
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const phone = document.getElementById("phoneNumber").value.trim();
  const condition = document.getElementById("condition").value;
  const physician = document.getElementById("physicianName").value.trim();
  const callDate = document.getElementById("firstCallDate").value;
  if (!firstName || !lastName || !phone || !condition || !physician) { alert("Please fill in all required fields"); return; }
  const res = await fetch(`${SUPABASE_URL}/functions/v1/add-patient`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type: "single", patient_first_name: firstName, patient_last_name: lastName, phone_number: phone, condition, physician_name: physician, next_call_date: callDate || null })
  });
  if (res.ok) { alert(`✅ ${firstName} ${lastName} added successfully`); closeModal(); loadPatients(); }
  else { const err = await res.json(); alert("❌ Failed to add patient: " + (err.error || "Unknown error")); }
}

function downloadTemplate() {
  const csv = "patient_first_name,patient_last_name,phone_number,condition,physician_name,next_call_date\nMargaret,Johnson,+14805551234,CHF,Dr. Abels,2026-07-01\n";
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "orbital_patient_template.csv";
  a.click();
}

function handleCSVUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
    csvPatients = lines.slice(1).map(line => {
      const values = line.split(",").map(v => v.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = values[i] || "");
      return obj;
    }).filter(p => p.patient_first_name || p.first_name);
    document.getElementById("csvPreview").textContent = `✅ ${csvPatients.length} patients ready to import`;
    document.getElementById("csvSubmit").style.display = "block";
  };
  reader.readAsText(file);
}

async function uploadCSV() {
  if (!csvPatients.length) { alert("No patients to import"); return; }
  const res = await fetch(`${SUPABASE_URL}/functions/v1/add-patient`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type: "bulk", patients: csvPatients })
  });
  if (res.ok) { const data = await res.json(); alert(`✅ ${data.patients_added} patients imported successfully`); closeModal(); loadPatients(); }
  else { const err = await res.json(); alert("❌ Import failed: " + (err.error || "Unknown error")); }
}

function toggleSection(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector(".section-chevron");
  body.classList.toggle("open");
  chevron.classList.toggle("open");
}

async function scheduleAvc(patientId, btn) {
  if (btn.textContent.includes("Scheduled")) {
    alert("After Visit Call is already scheduled for this patient.");
    return;
  }
  const today = new Date();
  const callDate = new Date(today.setDate(today.getDate() + 2))
    .toISOString()
    .split("T")[0];
  const res = await fetch(`${SUPABASE_URL}/functions/v1/manage-patient`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: "edit",
      patient_id: patientId,
      updates: {
        avc_scheduled: true,
        next_call_date: callDate
      }
    })
  });
  if (res.ok) {
    alert(`✅ After Visit Call scheduled for ${callDate}`);
    btn.textContent = "After Visit Call Scheduled ✓";
    btn.style.color = "var(--green)";
    btn.style.borderColor = "var(--green-border)";
    loadPatients();
  } else {
    alert("❌ Failed to schedule After Visit Call");
  }
}
