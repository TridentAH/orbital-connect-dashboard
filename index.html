<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbital">
  <link rel="manifest" href="manifest.json">
  <title>Orbital Connect</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2128;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent: #1a56db;
  --red: #f85149;
  --red-bg: #2d1214;
  --red-border: #6e1a1a;
  --yellow: #e3b341;
  --yellow-bg: #2d2000;
  --yellow-border: #6e5000;
  --green: #3fb950;
  --green-bg: #0d1f0f;
  --green-border: #1a4d1e;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
}

header {
  background: #010409;
  color: white;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-dot {
  width: 10px;
  height: 10px;
  background: #3b82f6;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.logo-text {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text-primary);
}

.logo-sub {
  font-size: 11px;
  color: var(--text-secondary);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.refresh-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}

.refresh-btn:hover { background: var(--border); }

.last-updated {
  font-size: 11px;
  color: var(--text-secondary);
  font-family: 'DM Mono', monospace;
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 16px;
}

.stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  text-align: center;
}

.stat-number {
  font-size: 24px;
  font-weight: 600;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat.red .stat-number { color: var(--red); }
.stat.yellow .stat-number { color: var(--yellow); }
.stat.green .stat-number { color: var(--green); }

.section-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.patient-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: box-shadow 0.2s;
}

.patient-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.4); }

.patient-card.red { border-left: 4px solid var(--red); }
.patient-card.yellow { border-left: 4px solid var(--yellow); }
.patient-card.green { border-left: 4px solid var(--green); }

.card-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}

.patient-info { flex: 1; }

.patient-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 3px;
  color: var(--text-primary);
}

.patient-meta {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  gap: 12px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}

.badge.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.badge.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.badge.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.card-body {
  padding: 0 20px 16px;
  display: none;
}

.card-body.open { display: block; }

.divider {
  height: 1px;
  background: var(--border);
  margin-bottom: 16px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.detail-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  margin-bottom: 2px;
}

.detail-value {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}

.summary-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

.flags-box {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--red);
  margin-bottom: 16px;
  font-family: 'DM Mono', monospace;
}

.flags-box.yellow {
  background: var(--yellow-bg);
  border-color: var(--yellow-border);
  color: var(--yellow);
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover { background: #1648c8; }

.btn-outline {
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-outline:hover { background: var(--surface2); }

.outcome-form {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
  display: none;
}

.outcome-form.open { display: block; }

.outcome-form h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text-primary);
}

select, textarea, input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  margin-bottom: 8px;
  color: var(--text-primary);
}

.outcome-submit {
  background: #16a34a;
  color: white;
  border: none;
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.chevron {
  font-size: 12px;
  color: var(--text-secondary);
  transition: transform 0.2s;
}

.chevron.open { transform: rotate(180deg); }

@media (max-width: 600px) {
  .detail-grid { grid-template-columns: 1fr; }
  .stats-bar { grid-template-columns: repeat(3, 1fr); }
}
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-text">Orbital Connect</div>
      <div class="logo-sub">BETWEEN VISITS CARE</div>
    </div>
  </div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" onclick="loadPatients()">↻ Refresh</button>
  </div>
</header>

<main>
  <div class="stats-bar">
    <div class="stat red">
      <div class="stat-number" id="countRed">—</div>
      <div class="stat-label">Urgent</div>
    </div>
    <div class="stat yellow">
      <div class="stat-number" id="countYellow">—</div>
      <div class="stat-label">Monitor</div>
    </div>
    <div class="stat green">
      <div class="stat-number" id="countGreen">—</div>
      <div class="stat-label">Stable</div>
    </div>
  </div>

  <div class="section-title">Patient Priority Queue</div>
  <div id="patients"><div class="loading">Loading patients...</div></div>
</main>

<script>
const SUPABASE_URL = "https://oomjzfqecnkshvfgmjqb.supabase.co";

async function loadPatients() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-dashboard-data`);
    const patients = await res.json();

    const container = document.getElementById("patients");

    if (!patients || patients.length === 0) {
      container.innerHTML = '<div class="empty">No patients found.</div>';
      return;
    }

    // Sort by priority score descending
    patients.sort((a, b) => b.priority_score - a.priority_score);

    // Update stats
    document.getElementById("countRed").textContent = patients.filter(p => p.priority_score >= 8).length;
    document.getElementById("countYellow").textContent = patients.filter(p => p.priority_score >= 3 && p.priority_score < 8).length;
    document.getElementById("countGreen").textContent = patients.filter(p => p.priority_score < 3).length;

    // Update last updated
    document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString();

    container.innerHTML = "";

    patients.forEach(patient => {
      const status = patient.priority_score >= 8 ? "red" : patient.priority_score >= 3 ? "yellow" : "green";
      const statusLabel = status === "red" ? "Urgent" : status === "yellow" ? "Monitor" : "Stable";
      const hasRedFlags = patient.flag_summary && patient.flag_summary !== "No flags" && status === "red";
      const hasYellowFlags = patient.flag_summary && patient.flag_summary !== "No flags" && status === "yellow";

      const card = document.createElement("div");
      card.className = `patient-card ${status}`;
      card.innerHTML = `
        <div class="card-header" onclick="toggleCard(this)">
          <div class="patient-info">
            <div class="patient-name">${patient.patient_first_name} ${patient.patient_last_name}</div>
            <div class="patient-meta">
              <span>${patient.condition}</span>
              <span>${patient.physician_name}</span>
              ${patient.last_call_date ? `<span>Last call: ${patient.last_call_date}</span>` : ""}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="badge ${status}">
              <span class="badge-dot"></span>
              ${statusLabel}
            </span>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="card-body">
          <div class="divider"></div>
          ${hasRedFlags ? `<div class="flags-box">🚨 ${patient.flag_summary}</div>` : ""}
          ${hasYellowFlags ? `<div class="flags-box yellow">⚠️ ${patient.flag_summary}</div>` : ""}
          <div class="detail-grid">
            <div class="detail-item">
              <div class="detail-label">Priority Score</div>
              <div class="detail-value">${patient.priority_score}/10</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Condition</div>
              <div class="detail-value">${patient.condition}</div>
            </div>
          </div>
          <div class="detail-label" style="margin-bottom:6px">Latest Call Summary</div>
          <div class="summary-box">${patient.latest_summary || "No calls yet"}</div>
          <div class="actions">
            <button class="btn btn-primary" onclick="callPatient(${patient.patient_id})">📞 Call Patient</button>
            <button class="btn btn-outline" onclick="toggleOutcome(this)">Log Outcome</button>
          </div>
          <div class="outcome-form">
            <h4>Log Outcome</h4>
            <select class="outcome-status-select">
              <option value="">Select outcome...</option>
              <option value="stable">Stable — no action needed</option>
              <option value="physician_notified">Physician notified</option>
              <option value="er_visit">ER visit</option>
              <option value="hospitalized">Hospitalized</option>
              <option value="no_followup">No follow-up needed</option>
            </select>
            <textarea placeholder="Notes (optional)" rows="2" class="outcome-notes"></textarea>
            <input type="text" placeholder="Your name" class="outcome-logged-by">
            <button class="outcome-submit" onclick="logOutcome(this, ${patient.patient_id})">Save Outcome</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

  } catch (err) {
    console.error(err);
    document.getElementById("patients").innerHTML = '<div class="empty">Failed to load patients. Check connection.</div>';
  }
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector(".chevron");
  body.classList.toggle("open");
  chevron.classList.toggle("open");
}

function toggleOutcome(btn) {
  const form = btn.closest(".card-body").querySelector(".outcome-form");
  form.classList.toggle("open");
}

async function callPatient(patientId) {
  const res = await fetch(
    `${SUPABASE_URL}/functions/v1/start-batch-call?patient_id=${patientId}`
  );
  if (res.ok) {
    alert("✅ Call started successfully");
  } else {
    alert("❌ Call failed — check connection");
  }
}

async function logOutcome(btn, patientId) {
  const form = btn.closest(".outcome-form");
  const status = form.querySelector(".outcome-status-select").value;
  const notes = form.querySelector(".outcome-notes").value;
  const loggedBy = form.querySelector(".outcome-logged-by").value;

  if (!status) {
    alert("Please select an outcome");
    return;
  }

  const res = await fetch(`${SUPABASE_URL}/functions/v1/log-outcome`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      call_id: patientId,
      outcome_status: status,
      outcome_notes: notes,
      outcome_logged_by: loggedBy || "staff",
      followup_required: false
    })
  });

  if (res.ok) {
    alert("✅ Outcome logged");
    form.classList.remove("open");
    loadPatients();
  } else {
    alert("❌ Failed to log outcome");
  }
}

// Auto refresh every 60 seconds
setInterval(loadPatients, 60000);
loadPatients();

// Register service worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
